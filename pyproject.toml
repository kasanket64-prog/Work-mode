[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-camera-system"
version = "0.1.0"
description = "Region-based relationship prediction for an intelligent camera pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
plates = ["fast-alpr[onnx]==0.4.0"]
video = ["opencv-python-headless~=5.0"]
detection = ["ultralytics==8.4.173"]
inference = ["relsgg[hub] @ git+https://github.com/Maelic/RelateAnything.git@06766fdf56752ca535fc9b971fca99ce563676d0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
camera-workspace = "camera_system.app:main"
camera-vehicle = "camera_system.vehicles:main"
camera-review = "camera_system.review:main"
camera-video = "camera_system.video_cli:main"
camera-relations = "camera_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_system = ["templates/*.html", "templates/*.json", "templates/*.css", "templates/*.js", "templates/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: loads real model weights; opt-in with RUN_MODEL_TESTS=1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["ultralytics"]
