services:
  fieldnote:
    build:
      context: .
      target: cpu
      args:
        EXTRAS: ${FIELDNOTE_EXTRAS:-video}
    ports:
      - "127.0.0.1:8780:8780"
    environment:
      # Override FIELDNOTE_AUTH_TOKEN in your environment or .env before exposing beyond localhost.
      FIELDNOTE_AUTH_TOKEN: ${FIELDNOTE_AUTH_TOKEN:-fieldnote-local-dev-token}
      FIELDNOTE_PORT: "8780"
      HF_HOME: /cache/hf
      YOLO_CONFIG_DIR: /cache/yolo
    volumes:
      - workspace_data:/data/workspace
      - model_cache:/cache
    restart: unless-stopped

  fieldnote-gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: cuda
      args:
        EXTRAS: ${FIELDNOTE_EXTRAS:-video}
    ports:
      - "127.0.0.1:8780:8780"
    environment:
      FIELDNOTE_AUTH_TOKEN: ${FIELDNOTE_AUTH_TOKEN:-fieldnote-local-dev-token}
      FIELDNOTE_PORT: "8780"
      HF_HOME: /cache/hf
      YOLO_CONFIG_DIR: /cache/yolo
    volumes:
      - workspace_data:/data/workspace
      - model_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  workspace_data:
  model_cache:
